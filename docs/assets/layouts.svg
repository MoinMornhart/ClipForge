<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1f55"/><stop offset="1" stop-color="#d0603c"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d3e57"/><stop offset="1" stop-color="#16202e"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="face"><circle r="22" fill="#f0c9a8"/><path d="M-30 46 C-26 22 26 22 30 46 Z" fill="#9146ff"/></g>
    <g id="boss"><path d="M-36 40 C-42 6 -22 -16 0 -18 C22 -16 42 6 36 40 Z" fill="#120914"/><circle cx="-10" cy="4" r="4" fill="#ff4d4d"/><circle cx="10" cy="4" r="4" fill="#ff4d4d"/></g>
  </defs>
  <rect width="1200" height="560" fill="#0f1218"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <!-- 1: Facecam oben -->
    <g transform="translate(60 40)">
      <rect width="220" height="390" rx="22" fill="#0b0d11" stroke="#3a4250" stroke-width="3"/>
      <rect x="10" y="10" width="200" height="120" rx="12" fill="url(#c)"/>
      <use href="#face" x="110" y="62"/>
      <rect x="10" y="134" width="200" height="246" rx="12" fill="url(#g)"/>
      <use href="#boss" x="120" y="270" transform="scale(1)"/>
      <rect x="30" y="300" width="160" height="30" rx="6" fill="#000" fill-opacity="0.55"/>
      <text x="110" y="321" font-size="16" font-weight="800" fill="#fff">UNTERTITEL</text>
      <text x="110" y="462" font-size="19" font-weight="700" fill="#fff">Facecam oben</text>
      <text x="110" y="488" font-size="15" fill="#94a0b2">geplant · M4</text>
    </g>
    <!-- 2: Gameplay + Cam-Ecke -->
    <g transform="translate(350 40)">
      <rect width="220" height="390" rx="22" fill="#0b0d11" stroke="#3a4250" stroke-width="3"/>
      <rect x="10" y="10" width="200" height="370" rx="12" fill="url(#g)"/>
      <use href="#boss" x="120" y="230"/>
      <rect x="22" y="24" width="80" height="62" rx="8" fill="url(#c)" stroke="#9146ff" stroke-width="2"/>
      <use href="#face" x="62" y="50" transform="translate(0 0)"/>
      <rect x="30" y="300" width="160" height="30" rx="6" fill="#000" fill-opacity="0.55"/>
      <text x="110" y="321" font-size="16" font-weight="800" fill="#fff">UNTERTITEL</text>
      <text x="110" y="462" font-size="19" font-weight="700" fill="#fff">Gameplay + Cam-Ecke</text>
      <text x="110" y="488" font-size="15" fill="#94a0b2">geplant · M4</text>
    </g>
    <!-- 3: Nur Facecam -->
    <g transform="translate(640 40)">
      <rect width="220" height="390" rx="22" fill="#0b0d11" stroke="#3a4250" stroke-width="3"/>
      <rect x="10" y="10" width="200" height="370" rx="12" fill="url(#c)"/>
      <g transform="translate(110 190) scale(2.6)"><use href="#face"/></g>
      <rect x="30" y="300" width="160" height="30" rx="6" fill="#000" fill-opacity="0.55"/>
      <text x="110" y="321" font-size="16" font-weight="800" fill="#fff">UNTERTITEL</text>
      <text x="110" y="462" font-size="19" font-weight="700" fill="#fff">Nur Facecam</text>
      <text x="110" y="488" font-size="15" fill="#94a0b2">geplant · M4</text>
    </g>
    <!-- 4: Blur-Hintergrund (fertig) -->
    <g transform="translate(930 40)">
      <rect width="220" height="390" rx="22" fill="#0b0d11" stroke="#f2a93b" stroke-width="3"/>
      <clipPath id="ph"><rect x="10" y="10" width="200" height="370" rx="12"/></clipPath>
      <g clip-path="url(#ph)">
        <rect x="10" y="10" width="200" height="370" fill="url(#g)" opacity="0.45"/>
        <rect x="10" y="140" width="200" height="112" fill="url(#g)"/>
        <use href="#boss" x="130" y="205" transform="translate(0 0)"/>
        <rect x="16" y="146" width="44" height="26" rx="4" fill="url(#c)" stroke="#9146ff" stroke-width="1.5"/>
      </g>
      <rect x="30" y="300" width="160" height="30" rx="6" fill="#000" fill-opacity="0.55"/>
      <text x="110" y="321" font-size="16" font-weight="800" fill="#fff">UNTERTITEL</text>
      <text x="110" y="462" font-size="19" font-weight="700" fill="#fff">Unscharfer Hintergrund</text>
      <text x="110" y="488" font-size="15" fill="#f2a93b">fertig ✓</text>
    </g>
  </g>
</svg>
